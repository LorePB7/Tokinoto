# Plano de Render (Blueprint) para publicar Tokinoto.
# Un solo servicio web gratuito: entrega la página del juego y atiende Socket.IO
# en la misma dirección. El historial va a una base PostgreSQL de Neon.
# Guía paso a paso: docs/despliegue.md
services:
  - type: web
    name: tokinoto
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    # --include=dev: hacen falta Vite y TypeScript para construir el cliente.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Se carga a mano en Render (nunca en el repositorio): la cadena de conexión de Neon.
      - key: DATABASE_URL
        sync: false
      # Fase 6: ID de cliente de Google (público: viaja en la página). Lo usan el
      # servidor y el build del cliente. Sin él, en producción el servidor no arranca.
      - key: GOOGLE_CLIENT_ID
        value: 446119324905-2t8ug5kqtrnp7fl2ad8tt7dudfjr2a8c.apps.googleusercontent.com
      # Clave para firmar las sesiones. La genera Render; si cambia, todos vuelven a entrar.
      - key: TOKINOTO_SECRETO_SESION
        generateValue: true
